<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理画面 — Sen Tsukigase</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>window.CMS_MANUAL_INIT = true;</script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'git-gateway',
          branch: 'main'
        },
        locale: 'ja',
        media_folder: 'images/uploads',
        public_folder: '/images/uploads',
        collections: [
          {
            name: 'works',
            label: 'Works（お仕事）',
            files: [
              {
                name: 'works_list',
                label: '作品リスト',
                file: 'data/works.json',
                format: 'json',
                fields: [
                  {
                    label: '作品',
                    name: 'items',
                    widget: 'list',
                    summary: '{{fields.title}} — {{fields.client}}',
                    fields: [
                      { label: 'タイトル',     name: 'title',  widget: 'string' },
                      { label: 'クライアント', name: 'client', widget: 'string', required: false },
                      { label: '用途',         name: 'usage',  widget: 'string', required: false },
                      { label: '媒体',         name: 'medium', widget: 'string', required: false },
                      { label: '制作年',       name: 'year',   widget: 'string' },
                      { label: '説明文',       name: 'desc',   widget: 'text',   required: false },
                      { label: '画像',         name: 'image',  widget: 'image',  required: false },
                      {
                        label: 'アスペクト比',
                        name: 'aspectRatio',
                        widget: 'select',
                        options: [
                          { label: '縦長（3:4）',   value: '3/4' },
                          { label: '横長（4:3）',   value: '4/3' },
                          { label: '正方形（1:1）', value: '1/1' }
                        ],
                        default: '3/4'
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            name: 'illustrations',
            label: 'Illustration（イラスト）',
            files: [
              {
                name: 'illustrations_list',
                label: 'イラストリスト',
                file: 'data/illustrations.json',
                format: 'json',
                fields: [
                  {
                    label: 'イラスト',
                    name: 'items',
                    widget: 'list',
                    summary: '{{fields.title}} — {{fields.category}}',
                    fields: [
                      { label: 'タイトル', name: 'title', widget: 'string' },
                      {
                        label: 'カテゴリ',
                        name: 'category',
                        widget: 'select',
                        options: [
                          { label: 'オリジナル',   value: 'original' },
                          { label: 'ファンアート', value: 'fanart' }
                        ],
                        default: 'original'
                      },
                      { label: '制作年', name: 'year',  widget: 'string' },
                      { label: '画像',   name: 'image', widget: 'image', required: false },
                      {
                        label: 'アスペクト比',
                        name: 'aspectRatio',
                        widget: 'select',
                        options: [
                          { label: '縦長（3:4）',   value: '3/4' },
                          { label: '横長（4:3）',   value: '4/3' },
                          { label: '正方形（1:1）', value: '1/1' }
                        ],
                        default: '3/4'
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
