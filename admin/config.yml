backend:
  name: git-gateway
  branch: main

locale: ja

media_folder: images/uploads
public_folder: images/uploads

collections:
  - name: works
    label: "Works（お仕事）"
    files:
      - name: works_list
        label: "作品リスト"
        file: "data/works.json"
        format: json
        fields:
          - label: "作品"
            name: items
            widget: list
            summary: "{{fields.title}} — {{fields.client}}"
            fields:
              - { label: "タイトル",     name: title,       widget: string }
              - label: "カテゴリ"
                name: category
                widget: select
                options:
                  - { label: "ウェブ制作", value: "web" }
                  - { label: "イラスト依頼", value: "illustration" }
                default: "web"
              - { label: "クライアント", name: client,      widget: string, required: false }
              - { label: "用途",         name: usage,       widget: string, required: false }
              - { label: "媒体",         name: medium,      widget: string, required: false }
              - { label: "制作年",       name: year,        widget: string }
              - { label: "説明文",       name: desc,        widget: text,   required: false }
              - { label: "サイトURL（任意）", name: siteUrl, widget: string, required: false, hint: "公開中のサイトURLがあれば入力してください（例: https://example.com）" }
              - { label: "画像",         name: image,       widget: image,  required: false, hint: "作品画像をアップロードしてください" }
              - label: "アスペクト比"
                name: aspectRatio
                widget: select
                options:
                  - { label: "縦長（3:4）",   value: "3/4" }
                  - { label: "横長（4:3）",   value: "4/3" }
                  - { label: "正方形（1:1）", value: "1/1" }
                default: "3/4"

  - name: profile
    label: "プロフィール設定"
    files:
      - name: profile
        label: "プロフィール"
        file: "data/profile.json"
        format: json
        fields:
          - label: "アイコン画像（丸型）"
            name: icon
            widget: image
            required: false
            hint: "Aboutセクション左側に丸く表示されます。X（Twitter）のプロフィール画像のような正方形〜縦横比1:1の画像を推奨。"

  - name: pricing
    label: "料金設定"
    files:
      - name: pricing
        label: "基本料金"
        file: "data/pricing.json"
        format: json
        fields:
          - label: "イラスト作成"
            name: illustration
            widget: object
            fields:
              - { label: "基本料金（例: ¥50,000 〜）", name: base, widget: string }
              - { label: "商用利用注記", name: commercial_note, widget: string, required: false }
          - label: "ウェブページ作成"
            name: web
            widget: object
            fields:
              - { label: "基本料金（例: ¥30,000 〜 ¥50,000）", name: base, widget: string }

  - name: illustrations
    label: "Illustration（イラスト）"
    files:
      - name: illustrations_list
        label: "イラストリスト"
        file: "data/illustrations.json"
        format: json
        fields:
          - label: "イラスト"
            name: items
            widget: list
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - { label: "タイトル", name: title, widget: string }
              - label: "カテゴリ"
                name: category
                widget: select
                options:
                  - { label: "オリジナル", value: "original" }
                  - { label: "ファンアート", value: "fanart" }
                default: "original"
              - { label: "制作年", name: year,  widget: string }
              - { label: "説明文", name: desc,  widget: text,   required: false }
              - { label: "X（Twitter）投稿URL", name: xUrl, widget: string, required: false, hint: "X（Twitter）の投稿URLをそのまま貼り付けてください（例: https://x.com/...）" }
              - { label: "画像",   name: image, widget: image, required: false }
              - label: "アスペクト比"
                name: aspectRatio
                widget: select
                options:
                  - { label: "縦長（3:4）",   value: "3/4" }
                  - { label: "横長（4:3）",   value: "4/3" }
                  - { label: "正方形（1:1）", value: "1/1" }
                default: "3/4"
